[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartgym"
version = "0.1.0"
description = "Edge-AI scoring and evidence for badminton and tennis: ball tracking, in/out line calls, official rules, proof images"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "IoT Multipurpose Gymnasium project"}]
keywords = ["iot", "edge-ai", "sports-analytics", "badminton", "tennis", "computer-vision"]
# opencv-python-headless, not opencv-python: the GUI build links against libGL,
# which does not exist on a server, a Jetson, a Raspberry Pi or inside Docker.
# This project never opens a window (all output is written to disk), so the
# headless build is correct everywhere and avoids `ImportError: libGL.so.1`.
dependencies = ["numpy>=1.23", "opencv-python-headless>=4.8", "PyYAML>=6.0"]

[project.optional-dependencies]
yolo = ["ultralytics>=8.1", "torch>=2.0"]
dev = ["pytest>=7.4"]

[project.scripts]
smartgym = "smartgym.cli:main"

[tool.setuptools.packages.find]
include = ["smartgym*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
